[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # Line length handled gracefully
    "RUF012", # Mutable class attributes in Django models and forms
    "BLE001", # Blind exception catch for fallback caches
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]
