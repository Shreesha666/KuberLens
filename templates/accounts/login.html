{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | KuberLens</title>
    <!-- Platform Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'branding/favicon/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'branding/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'branding/favicon/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'branding/favicon/favicon-180x180.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="text-center mb-4">
                    <img src="{% static 'branding/logo/kuberlens-primary-logo.png' %}" alt="KuberLens Logo" height="40" class="mb-2" style="max-height: 44px; width: auto; object-fit: contain;">
                    <p class="text-muted small">Personal Stock Market Research & Intelligence Platform</p>
                </div>

                <div class="stat-card p-4 shadow-sm border-secondary border-opacity-25">
                    <h5 class="fw-semibold mb-3 text-body">Sign In to Platform</h5>

                    {% if form.errors %}
                    <div class="alert alert-danger py-2 px-3 small mb-3">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid username or password. Please try again.
                    </div>
                    {% endif %}

                    <form method="post" action="{% url 'accounts:login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label text-muted small fw-medium">Username</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-4">
                            <label for="id_password" class="form-label text-muted small fw-medium">Password</label>
                            {{ form.password }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            Sign In to Platform
                        </button>
                    </form>
                </div>

                <div class="text-center mt-4">
                    <a href="{% url 'dashboard:index' %}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Continue to Dashboard as Guest
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
