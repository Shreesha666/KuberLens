{% extends "base/shell.html" %}

{% block content %}
<div class="container py-5 text-center">
    <div class="display-1 text-danger fw-bold mb-3">500</div>
    <h3 class="fw-bold mb-2">Internal Service Exception</h3>
    <p class="text-muted mb-4">An unexpected application error occurred. The incident has been recorded in system logs.</p>
    <a href="{% url 'dashboard:index' %}" class="btn btn-outline-primary"
       hx-get="{% url 'dashboard:index' %}" hx-target="#main-content" hx-push-url="true">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
