{% if results %}
<div class="list-group shadow border-secondary border-opacity-25" style="max-height: 380px; overflow-y: auto;">
    {% for item in results %}
    <a href="{{ item.url }}" class="list-group-item list-group-item-action py-2 px-3 d-flex justify-content-between align-items-center"
       hx-get="{{ item.url }}" hx-target="#main-content" hx-push-url="true"
       onclick="document.getElementById('search-results').innerHTML = '';">
        <div>
            <div class="d-flex align-items-center gap-2">
                <span class="fw-bold text-primary">{{ item.symbol }}</span>
                <span class="badge bg-secondary-subtle text-body border small">{{ item.exchange }}</span>
                <span class="small text-muted">{{ item.name }}</span>
            </div>
            <div class="small text-muted" style="font-size: 0.75rem;">
                {{ item.sector }} &bull; ISIN: {{ item.isin }}
            </div>
        </div>
        <span class="badge bg-light text-secondary border">{{ item.cap }}</span>
    </a>
    {% endfor %}
</div>
{% elif query %}
<div class="list-group shadow border-secondary border-opacity-25">
    <div class="list-group-item py-2 px-3 text-muted small text-center">
        No instruments matching "<strong>{{ query }}</strong>"
    </div>
</div>
{% endif %}
